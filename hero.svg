<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Emanuel Victor</title>
  <desc id="d">Emanuel Victor, Desenvolvedor de Software e Fundador da Dev Digital, de Fortaleza, Ceará.</desc>
  <style>
    .name { font: 700 56px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F5F5F7; letter-spacing: -1.5px; }
    .role { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #A78BFA; }
    .meta { font: 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9CA3AF; letter-spacing: .3px; }
    .typing { animation: typing 3.2s steps(52, end) .6s both; }
    .cursor { fill: #A78BFA; animation: move 3.2s steps(52, end) .6s both, blink 1s step-end 3.8s infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 48s linear infinite; }
    .spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 64s linear infinite reverse; }
    @keyframes typing { from { width: 0; } to { width: 580px; } }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(570px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .typing, .spin, .spin-rev { animation: none; }
      .cursor { animation: none; display: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F5F5F7" opacity=".07"/>
    </pattern>
    <clipPath id="reveal">
      <rect class="typing" x="64" y="136" width="580" height="34"/>
    </clipPath>
  </defs>

  <rect x=".5" y=".5" width="879" height="239" rx="16" fill="#0D0D0F" stroke="#26262E"/>
  <rect x="1" y="1" width="878" height="238" rx="15" fill="url(#dots)"/>

  <!-- Geometria discreta -->
  <g fill="none" stroke="#8B5CF6" stroke-width="1.2">
    <rect class="spin" x="682" y="72" width="96" height="96" opacity=".55"/>
    <rect class="spin-rev" x="662" y="52" width="136" height="136" opacity=".25" stroke="#A78BFA"/>
    <rect x="710" y="100" width="40" height="40" opacity=".9"/>
  </g>
  <circle cx="730" cy="120" r="3" fill="#A78BFA"/>

  <!-- Conteúdo -->
  <rect x="64" y="52" width="40" height="3" rx="1.5" fill="#8B5CF6"/>
  <text class="name" x="62" y="116">Emanuel Victor</text>

  <g clip-path="url(#reveal)">
    <text class="role" x="64" y="158" xml:space="preserve">Desenvolvedor de Software  •  Fundador da Dev Digital</text>
  </g>
  <rect class="cursor" x="64" y="143" width="2" height="19"/>

  <text class="meta" x="64" y="198">Fortaleza, Ceará  ·  Engenharia de Software  ·  Back-end e Full Stack</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
